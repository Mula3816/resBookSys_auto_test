# 接口自动化测试 CI:每次 push / PR 自动跑全量用例并上传 HTML 报告
#
# 被测系统仓库: https://github.com/Mula3816/resBookSys
# 本测试仓库:   https://github.com/Mula3816/resBookSys_auto_test
name: API Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: 检出测试代码
        uses: actions/checkout@v4

      - name: 检出被测系统(后端仓库)
        uses: actions/checkout@v4
        with:
          repository: Mula3816/resBookSys
          path: backend-src

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装测试依赖
        run: pip install -r requirements.txt

      - name: 安装后端依赖
        working-directory: backend-src/backend
        run: npm install

      - name: 准备环境变量与数据库
        working-directory: backend-src/backend
        run: |
          cp .env.example .env
          npm run init-db
          node scripts/initializeCompleteSystem.js
          mkdir -p uploads   # multer 上传目录(应用启动不会自动创建,缺失会导致上传 500)

      - name: 启动后端服务
        working-directory: backend-src/backend
        run: nohup node server.js > /tmp/backend.log 2>&1 &

      - name: 运行接口测试
        env:
          BASE_URL: http://localhost:5000
          BACKEND_DIR: backend-src/backend
        run: python3 -m pytest

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report/report.html

  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - name: 检出测试代码
        uses: actions/checkout@v4

      - name: 检出被测系统(后端+前端)
        uses: actions/checkout@v4
        with:
          repository: Mula3816/resBookSys
          path: backend-src

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装 UI 测试依赖与浏览器
        run: |
          pip install -r requirements-ui.txt
          # playwright 1.46 钉死 greenlet==3.0.3(Python 3.13 无轮子),--no-deps 绕过
          pip install "playwright==1.46.0" "pytest-playwright==0.5.2" --no-deps
          python3 -m playwright install --with-deps chromium

      - name: 安装前端与后端依赖
        run: |
          npm install --prefix backend-src/frontend
          npm install --prefix backend-src/backend

      - name: 准备后端环境变量与数据库
        working-directory: backend-src/backend
        run: |
          cp .env.example .env
          npm run init-db
          node scripts/initializeCompleteSystem.js
          mkdir -p uploads   # multer 上传目录(应用启动不会自动创建)

      - name: 运行 UI 测试(conftest 自动拉起前后端)
        working-directory: ui
        env:
          BASE_URL: http://localhost:5000
          BACKEND_DIR: ../backend-src/backend
          FRONTEND_DIR: ../backend-src/frontend
        run: python3 -m pytest

      - name: 上传 UI 测试报告与产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: |
            ui/report/ui_report.html
            ui/test-results/
